name: P45 BCn per-(mip,layer) completed Vulkan image view proof (NOT APK)
on:
  push:
    branches: [exp/bachata-f43dev-p45-bcn-layer-view-active]
    paths:
      - 'tools/bachata-p45/**'
      - '.github/workflows/bachata-f43dev-p45-bcn-layer-proof.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  source-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source kits
        run: |
          set -euo pipefail
          echo 'ca072f43d63385b62d7411bb77a80f82e8dc1aded237a07c70c91ce38340ee39  tools/bachata-p36/source-kit.tar.xz' | sha256sum -c -
          echo '366e259058f9e0ef3608f0fd67b5d3e11bc8096e85040199cb486568e2a92c80  tools/bachata-p37/source-delta.tar.xz' | sha256sum -c -
          echo 'a74edea8081197971d30505ce89caf50dbcd1be6c47d81a9338a0b839bf6ea14  tools/bachata-p38/source-delta.tar.xz' | sha256sum -c -
          echo '9614c70a68c7257c8ba6c64ebfeaf3aeb2bc25878397714539621886761d0eb2  tools/bachata-p39/source-delta.tar.xz' | sha256sum -c -
          echo 'd0c9847836489ac03c5604b9ab391dd3cc2c7db43c363a75f24cd89d44c6c6dd  tools/bachata-p45/source-delta.tar.xz' | sha256sum -c -
          mkdir kit
          for p in tools/bachata-p36/source-kit.tar.xz tools/bachata-p37/source-delta.tar.xz tools/bachata-p38/source-delta.tar.xz tools/bachata-p39/source-delta.tar.xz tools/bachata-p45/source-delta.tar.xz; do tar -xJf "$p" -C kit; done
      - name: Run Python port regression and P45 integration tests
        run: |
          set -euo pipefail
          cd kit/source
          python3 -m unittest discover -s . -p 'test_port_p3*.py' -q
          python3 -m unittest -q test_port_p45.py
      - name: Compile BCn per-layer view contract in GCC and Clang ASan UBSan
        run: |
          set -euo pipefail
          cd kit/source
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic -I. test_p44.cpp -o /tmp/p45-contract
          /tmp/p45-contract
          clang++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer -I. test_p44.cpp -o /tmp/p45-contract-san
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/p45-contract-san
      - name: Apply port to exact public pinned source, check live C++ paths
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/zenithblue-oss/shadps4-arm64.git upstream
          git -C upstream checkout --detach be6bc2e9c60799e071dd2fafa6216e8d80ec619c
          python3 kit/source/port_renderer_p45.py --source-root upstream --out p45-port.diff --write > p45-result.json
          git -C upstream diff --check
          grep -Fq 'P45_BCN_PER_LAYER_VIEW_PROOF' upstream/src/video_core/texture_cache/image_view.cpp
          grep -Fq 'P45_BCN_LAYER_UPLOAD_COMPLETE' upstream/src/video_core/renderer_vulkan/p27_vk_decoded_upload.cpp
          grep -Fq 'p45_completed_bc_uploads.clear()' upstream/src/video_core/texture_cache/image.cpp
          grep -Fq 'BachataP44::Resolve(p45_request)' upstream/src/video_core/texture_cache/image_view.cpp
          grep -Fq 'P39_EXACT_IMAGE_ID_SAMPLED_STORAGE' upstream/src/video_core/renderer_vulkan/vk_rasterizer.cpp
          grep -Fq 'P25 decoded BCn sampled view blocked' upstream/src/video_core/texture_cache/image_view.cpp
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p45-public-core-source-preflight-NOT-APK
          path: |
            p45-port.diff
            p45-result.json
          retention-days: 14
          if-no-files-found: warn

  glibc-arm64:
    needs: source-preflight
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    timeout-minutes: 120
    steps:
      - name: Bootstrap
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates python3 bash coreutils xz-utils binutils
      - uses: actions/checkout@v4
      - name: Restore integrity-verified port chain
        run: |
          set -euo pipefail
          echo 'ca072f43d63385b62d7411bb77a80f82e8dc1aded237a07c70c91ce38340ee39  tools/bachata-p36/source-kit.tar.xz' | sha256sum -c -
          echo '366e259058f9e0ef3608f0fd67b5d3e11bc8096e85040199cb486568e2a92c80  tools/bachata-p37/source-delta.tar.xz' | sha256sum -c -
          echo 'a74edea8081197971d30505ce89caf50dbcd1be6c47d81a9338a0b839bf6ea14  tools/bachata-p38/source-delta.tar.xz' | sha256sum -c -
          echo '9614c70a68c7257c8ba6c64ebfeaf3aeb2bc25878397714539621886761d0eb2  tools/bachata-p39/source-delta.tar.xz' | sha256sum -c -
          echo 'd0c9847836489ac03c5604b9ab391dd3cc2c7db43c363a75f24cd89d44c6c6dd  tools/bachata-p45/source-delta.tar.xz' | sha256sum -c -
          mkdir kit
          for p in tools/bachata-p36/source-kit.tar.xz tools/bachata-p37/source-delta.tar.xz tools/bachata-p38/source-delta.tar.xz tools/bachata-p39/source-delta.tar.xz tools/bachata-p45/source-delta.tar.xz; do tar -xJf "$p" -C kit; done
      - name: Obtain exact public source with recursive submodules
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/zenithblue-oss/shadps4-arm64.git upstream
          git -C upstream checkout --detach be6bc2e9c60799e071dd2fafa6216e8d80ec619c
          git -C upstream submodule update --init --recursive --jobs 8
          git -C upstream submodule status --recursive > submodules.txt
          if grep -Eq '^[+\-U]' submodules.txt; then exit 3; fi
      - name: Install native GLIBC aarch64 build dependencies
        run: |
          set -euo pipefail
          cd upstream
          BACHATA_INSIDE_DEBIAN_CONTAINER=1 bash runtime/scripts/install-debian-runtime-deps.sh
      - name: Compile public core with per-layer P45 view proof
        run: |
          set -euo pipefail
          mkdir -p p45-build
          python3 kit/source/port_renderer_p45.py --source-root upstream --out p45-build/p45-port.diff --write >p45-build/apply.json
          git -C upstream diff --check
          ( cd upstream && bash runtime/scripts/build-shadps4-arm64.sh ) >p45-build/build.log 2>&1 || { tail -200 p45-build/build.log; exit 1; }
          elf=upstream/runtime/build/shadps4-arm64-stage/bin/shadps4-arm64
          test -s "$elf"
          readelf -h "$elf" >p45-build/elf-header.txt
          readelf -l "$elf" >p45-build/elf-program.txt
          grep -Eq 'Machine:[[:space:]]+AArch64' p45-build/elf-header.txt
          grep -Fq '/lib/ld-linux-aarch64.so.1' p45-build/elf-program.txt
          sha256sum "$elf" >p45-build/SHA256SUMS.txt
          printf '%s\n' 'PUBLIC_CORE_P45=COMPILED' 'F43DEV_PRIVATE_CORE_MODIFIED=NO' 'F43DEV_APK_BUILT=NO' 'BCN_PER_LAYER_GPU_PROOF=INTEGRATED_PUBLIC_ONLY' 'OUTLAST_FIXED=NO' 'MINECRAFT_FIXED=NO' > p45-build/RELEASE-GATE.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p45-public-aarch64-GLIBC-build-evidence-NOT-APK
          path: |
            p45-build/
            submodules.txt
          retention-days: 14
          if-no-files-found: warn
