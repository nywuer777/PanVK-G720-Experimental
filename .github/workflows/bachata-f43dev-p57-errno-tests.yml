name: P57 BSF1 errno-category gates (mock, NOT APK)
on:
  push:
    branches: [exp/bachata-f43dev-p57-bsf1-recv-errno]
    paths:
      - 'tools/bachata-p57/**'
      - '.github/workflows/bachata-f43dev-p57-errno-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  classification:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Synthesize exact P56+P57 sources without any private app input
        run: |
          set -euo pipefail
          mkdir -p p57-fixture/src/platform/bachata
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path[:0]=['tools/bachata-p56','tools/bachata-p57']
          from patch_p56 import patch as p56
          from patch_p57 import patch as p57
          h=Path('tools/bachata-r2a5/saf_bsf1_client.h').read_text()
          c=Path('tools/bachata-r2a5/saf_bsf1_client.cpp').read_text()
          b=Path('tools/bachata-p54/p54_bsf1_eboot.h').read_text()
          a=p57(*p56(h,c,b))
          source=Path('p57-fixture/src/platform/bachata')
          for name,payload in zip(('saf_bsf1_client.h','saf_bsf1_client.cpp','p54_bsf1_eboot.h'),a):
              (source/name).write_text(payload)
          try:
              p57(*a)
              raise RuntimeError('SECOND_APPLY_WAS_ACCEPTED')
          except ValueError:
              pass
          assert "MSG_CMSG_CLOEXEC" in a[1]
          assert 'BACHATA_P57_BSF1_HEADER_PEER_RESET' in a[2]
          assert 'BACHATA_P57_BSF1_HEADER_POLICY_DENIED' in a[2]
          assert 'SameUidPeer(sock.get())' in a[1]
          assert 'broker.OpenRead("eboot.bin")' in a[2]
          PY
      - name: Compile and execute all categories against linked production BSF1 client
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread -Ip57-fixture/src \
            tools/bachata-p57/test_errno.cpp \
            p57-fixture/src/platform/bachata/saf_bsf1_client.cpp -o /tmp/p57-errno-test
          /tmp/p57-errno-test
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pthread \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Ip57-fixture/src \
            tools/bachata-p57/test_errno.cpp \
            p57-fixture/src/platform/bachata/saf_bsf1_client.cpp -o /tmp/p57-errno-asan
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/p57-errno-asan
          printf '%s\n' \
            'P57_RECVMSG_ERRNO_CLASSIFICATION=PASS_SYNTHETIC' \
            'P57_BSF1_REQUEST_BYTES_AND_SOCKET_FLAGS=UNMODIFIED' \
            'P57_ANDROID_BROKER=NOT_TESTED' \
            'P57_F43LAB_APK=NOT_BUILT' \
            'P57_ORIGINAL_P42=UNMODIFIED' >> "$GITHUB_STEP_SUMMARY"
