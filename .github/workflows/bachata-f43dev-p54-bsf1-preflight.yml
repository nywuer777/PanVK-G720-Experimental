name: P54 First eboot via same-UID SAF BSF1 (synthetic protocol gates, NOT APK)
on:
  push:
    branches: [exp/bachata-f43dev-p54-bsf1-initial-eboot]
    paths:
      - 'tools/bachata-p54/**'
      - '.github/workflows/bachata-f43dev-p54-bsf1-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p54-authenticated-first-eboot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test strict source anchors, no trust bypasses
        run: |
          set -euo pipefail
          PYTHONPATH=tools/bachata-p54 python3 -m unittest discover -s tools/bachata-p54 -p 'test_*.py' -v
      - name: Compile actual BSF1 client and authenticate synthetic AF_UNIX broker
        run: |
          set -euo pipefail
          mkdir -p p54-test/src/platform/bachata
          cp tools/bachata-r2a5/saf_bsf1_client.cpp tools/bachata-r2a5/saf_bsf1_client.h \
            p54-test/src/platform/bachata/
          cp tools/bachata-p54/p54_bsf1_eboot.h p54-test/src/platform/bachata/
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -O2 -pthread \
            -Ip54-test/src \
            tools/bachata-p54/test_bsf1_eboot.cpp \
            p54-test/src/platform/bachata/saf_bsf1_client.cpp \
            -o p54-test/mock-bsf1-eboot
          p54-test/mock-bsf1-eboot
          printf '%s\n' \
            'P54_BSF1_MOCK_SAME_UID_FD_TRANSFER=PASS' \
            'P54_P42_PRIVATE_APK=NOT_MODIFIED' \
            'P54_REAL_ANDROID_BROKER=NOT_TESTED' \
            'P54_OUTLAST_GAMEPLAY=NOT_TESTED' >> "$GITHUB_STEP_SUMMARY"
      - name: Package P54 non-sensitive reproducible sources and negative evidence
        run: |
          set -euo pipefail
          mkdir -p p54-source-evidence
          cp tools/bachata-p54/README.md tools/bachata-p54/p54_bsf1_eboot.h \
            tools/bachata-p54/patch_p54.py tools/bachata-p54/test_patch.py \
            tools/bachata-p54/test_bsf1_eboot.cpp p54-source-evidence/
          printf '%s\n' \
            'P54_AUTHENTICATED_FAKE_BROKER_FD_TEST=PASS' \
            'P54_UNDERLYING_R2A5_CLIENT=USED_UNMODIFIED' \
            'P54_REAL_ANDROID_BROKER=UNVERIFIED' \
            'P54_FULL_GAME_VFS=NOT_IMPLEMENTED' \
            'P54_ANDROID_APK=NOT_CREATED_BY_THIS_WORKFLOW' > p54-source-evidence/P54-SCOPE.txt
          (cd p54-source-evidence && sha256sum README.md p54_bsf1_eboot.h \
            patch_p54.py test_patch.py test_bsf1_eboot.cpp P54-SCOPE.txt > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: p54-first-eboot-bsf1-source-and-mock-evidence-NOT-APK
          path: p54-source-evidence/
          retention-days: 14

