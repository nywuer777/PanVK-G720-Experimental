name: P60 SAF libc.prx exact-path staging (mock, NOT APK)
on:
  push:
    branches: [exp/bachata-f43dev-p60-libc-saf-preflight]
    paths:
      - 'tools/bachata-p60/**'
      - '.github/workflows/bachata-f43dev-p60-libc-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-authorized-library:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Assert reproducible main.cpp source-anchor patch
        run: |
          set -euo pipefail
          PYTHONPATH=tools/bachata-p60 python3 -m unittest discover \
            -s tools/bachata-p60 -p 'test_*.py' -v
      - name: Compile guarded private-stage test with GCC and Clang ASAN/UBSAN
        run: |
          set -euo pipefail
          mkdir -p p60-fixture/src/platform/bachata
          cp tools/bachata-p60/p60_saf_libc_stage.h \
             p60-fixture/src/platform/bachata/
          cp tools/bachata-r2a5/saf_bsf1_client.h \
             p60-fixture/src/platform/bachata/
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic -pthread \
            -Ip60-fixture/src tools/bachata-p60/test_stage_libc.cpp \
            -o p60-fixture/test-stage
          p60-fixture/test-stage
          clang++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -pthread \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Ip60-fixture/src \
            tools/bachata-p60/test_stage_libc.cpp -o p60-fixture/test-stage-asan
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            p60-fixture/test-stage-asan
      - name: Build actual integrated P58 BSF1 client and run broker-authorized Stat OpenRead
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path
          for d in ('tools/bachata-p56','tools/bachata-p57','tools/bachata-p58'):
              sys.path.insert(0,d)
          from patch_p56 import patch as p56
          from patch_p57 import patch as p57
          from patch_p58 import patch as p58
          h=Path('tools/bachata-r2a5/saf_bsf1_client.h').read_text()
          c=Path('tools/bachata-r2a5/saf_bsf1_client.cpp').read_text()
          b=Path('tools/bachata-p54/p54_bsf1_eboot.h').read_text()
          h,c,b=p57(*p56(h,c,b))
          c,b=p58(c,b)
          root=Path('p60-fixture/src/platform/bachata')
          for name,content in (('saf_bsf1_client.h',h),
                               ('saf_bsf1_client.cpp',c),
                               ('p54_bsf1_eboot.h',b)):
              (root/name).write_text(content)
          assert 'SameUidPeer(sock.get())' in c
          assert 'MSG_CMSG_CLOEXEC' in c
          assert 'AppendBe16(packet, static_cast<uint16_t>(config_.token.size()))' in c
          PY
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic -pthread \
            -Ip60-fixture/src tools/bachata-p60/test_broker_libc.cpp \
            p60-fixture/src/platform/bachata/saf_bsf1_client.cpp \
            -o p60-fixture/test-broker
          p60-fixture/test-broker
          clang++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -pthread \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ip60-fixture/src tools/bachata-p60/test_broker_libc.cpp \
            p60-fixture/src/platform/bachata/saf_bsf1_client.cpp \
            -o p60-fixture/test-broker-asan
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            p60-fixture/test-broker-asan
          printf '%s\n' \
            'P60_EXACT_LIBC_PRX_STAT_AND_OPENREAD=PASS_MOCK' \
            'P60_PRIVATE_STAGE_0600_SYMLINK_AND_SIZE_GATES=PASS_MOCK' \
            'P60_BROKER_DENIED_WAS_NOT_TREATED_AS_MISSING=PASS_MOCK' \
            'P60_ONLY_EXACT_SCE_MODULE_LIBC_PRX=YES' \
            'P60_REAL_ANDROID_BROKER=NOT_TESTED' \
            'P60_FULL_GUEST_APP0_VFS=NOT_IMPLEMENTED' \
            'P60_PRIVATE_P42_AND_PANVK=UNMODIFIED' >> "$GITHUB_STEP_SUMMARY"
